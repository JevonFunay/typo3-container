server {
    listen 80;
    server_name _;

    client_max_body_size 64M;

    # /dba (tanpa slash) diarahkan ke /dba/ biar link relatif phpMyAdmin nggak rusak
    location = /dba {
        return 301 /dba/;
    }

    # /dba/ -> phpMyAdmin (container dba, port 80)
    # trailing slash di proxy_pass = prefix /dba/ dibuang sebelum diteruskan
    location /dba/ {
        proxy_pass         http://dba:80/;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # / -> CMS TYPO3 (container cms, port 80)
    location / {
        proxy_pass         http://cms:80;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
