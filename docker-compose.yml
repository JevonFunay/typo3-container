# Graded Exercise Docker Compose
# 4 service dalam 1 network: proxy (nginx), cms (TYPO3), db (MariaDB), dba (phpMyAdmin)
# Semua kredensial diambil dari file .env (di-download dari S3 saat EC2 boot).

services:
  proxy:
    image: nginx:stable-alpine
    container_name: proxy
    restart: always
    ports:
      - "80:80"            # satu-satunya port yang dibuka ke luar
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms
      - dba
    networks:
      - cloudnet

  cms:
    image: martinhelmich/typo3:13
    container_name: cms
    restart: always
    # tidak ada "ports": CMS cuma bisa diakses lewat proxy
    # boot pertama: install TYPO3 otomatis via CLI, lalu start Apache
    entrypoint: ["sh", "/usr/local/bin/typo3-init.sh"]
    environment:
      TYPO3_DB_DRIVER: mysqli
      TYPO3_DB_HOST: db
      TYPO3_DB_PORT: 3306
      TYPO3_DB_DBNAME: ${DB_NAME}
      TYPO3_DB_USERNAME: ${DB_USER}
      TYPO3_DB_PASSWORD: ${DB_PASSWORD}
      TYPO3_SETUP_ADMIN_USERNAME: ${TYPO3_ADMIN_USER}
      TYPO3_SETUP_ADMIN_PASSWORD: ${TYPO3_ADMIN_PASSWORD}
      TYPO3_SETUP_ADMIN_EMAIL: ${TYPO3_ADMIN_EMAIL}
      TYPO3_PROJECT_NAME: Cloud Graded Exercise
      TYPO3_SERVER_TYPE: apache
      # wajib URL valid saat setup; base-nya lalu diganti "/" oleh typo3-init.sh
      TYPO3_SETUP_CREATE_SITE: http://${PUBLIC_HOST:-localhost}/
    volumes:
      - ./cms/typo3-init.sh:/usr/local/bin/typo3-init.sh:ro
      - typo3_fileadmin:/var/www/html/fileadmin
      - typo3_conf:/var/www/html/typo3conf
      - typo3_temp:/var/www/html/typo3temp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudnet

  db:
    image: mariadb:11
    container_name: db
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cloudnet

  dba:
    image: phpmyadmin:latest
    container_name: dba
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # phpMyAdmin di belakang proxy pada path /dba/ (yang dipakai PMA: path-nya)
      PMA_ABSOLUTE_URI: http://${PUBLIC_HOST:-localhost}/dba/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudnet

networks:
  cloudnet:
    driver: bridge

volumes:
  db_data:
  typo3_fileadmin:
  typo3_conf:
  typo3_temp:
